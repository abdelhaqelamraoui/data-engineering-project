name: trending-topics-pipeline

services:
  kafka:
    build: ./infra/kafka
    container_name: trending-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [trending-net]

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: trending-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-bluesky-posts}
      - --partitions
      - "3"
      - --replication-factor
      - "1"
      - --bootstrap-server
      - kafka:9092
    networks: [trending-net]

  hbase:
    build: ./infra/hbase
    container_name: trending-hbase
    environment:
      HBASE_CONF_hbase_rootdir: file:///hbase-data/data
      HBASE_CONF_hbase_zookeeper_property_dataDir: /hbase-data/zookeeper
      HBASE_CONF_hbase_cluster_distributed: "false"
    volumes:
      - hbase-data:/hbase-data
    ports:
      - "${HBASE_MASTER_UI_PORT:-16010}:16010"
      - "${HBASE_REST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/version >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [trending-net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: trending-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [trending-net]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: trending-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks: [trending-net]

  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    container_name: trending-indexer
    env_file: ./services/indexer/.env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks: [trending-net]

  producer:
    build: ./services/producer
    container_name: trending-producer
    env_file: ./services/producer/.env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - producer-data:/data
    restart: unless-stopped
    networks: [trending-net]

  spark-processor:
    build:
      context: .
      dockerfile: services/spark-processor/Dockerfile
    container_name: trending-spark-processor
    env_file: ./services/spark-processor/.env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hbase:
        condition: service_healthy
    volumes:
      - spark-checkpoints:/checkpoints
    restart: unless-stopped
    networks: [trending-net]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: trending-api
    env_file: ./services/api/.env
    depends_on:
      hbase:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks: [trending-net]

  dashboard:
    build: ./services/dashboard
    container_name: trending-dashboard
    env_file: ./services/dashboard/.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
    networks: [trending-net]

networks:
  trending-net:
    name: trending-net

volumes:
  kafka-data:
  hbase-data:
  elasticsearch-data:
  producer-data:
  spark-checkpoints:
